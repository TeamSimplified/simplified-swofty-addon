[package]
name = "swofty-addon-simplified"
description = "Team Simplified: .serps mods for Swofty Launcher for F1 25"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TeamSimplified/simplified-swofty-addon"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
sha2 = "0.11"
swofty-addon = { git = "https://github.com/Swofty-Developments/SwoftyLauncher", tag = "v0.2.8" }
swofty-formats = { git = "https://github.com/Swofty-Developments/SwoftyLauncher", tag = "v0.2.8" }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
