[package]
name = "swofty-addon-simplified"
description = "Simplified for Swofty, by Team Simplified: its Simplified Importer turns any F1 25 mod into a Swofty Launcher addon, and its Grid Editor edits the grids"
version = "0.13.7"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TeamSimplified/simplified-swofty-addon"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jpeg-decoder = "0.3"
png = "0.18"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
sha2 = "0.11"
swofty-core = { git = "https://github.com/Swofty-Developments/SwoftyLauncher", rev = "ef27d827864f2618a0d00513664d65354772446f" }
swofty-addon = { git = "https://github.com/Swofty-Developments/SwoftyLauncher", rev = "ef27d827864f2618a0d00513664d65354772446f" }
swofty-formats = { git = "https://github.com/Swofty-Developments/SwoftyLauncher", rev = "ef27d827864f2618a0d00513664d65354772446f" }
zip = { version = "9", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
rars = { version = "=0.10.0", default-features = false }

[dev-dependencies]
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress"] }
rars = { version = "=0.10.0", default-features = false, features = ["write"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

